<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Leaf</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div class="title">
      <h1>Green Leaf</h1>
    </div>

    <hr />

    <form>
      <div class="profile">
        <button
          class="accicon"
          type="button"
          id="profileToggleBtn"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="profileMenu"
        >
          <span class="material-symbols-outlined">account_circle</span>
        </button>

        <div id="profileMenu" class="profile-menu" hidden>
          <h3>Vehicle Profile</h3>
          <div id="carSelector">
            <select id="Make"></select>
            <select id="Model"></select>
            <select id="EngineSize"></select>
            <select id="FuelType"></select>
            <button id="saveProfileBtn" type="button">Save Profile</button>
            <span id="profileStatus" role="status" aria-live="polite"></span>
          </div>
        </div>
      </div>
    </form>

    <form class="ser" id="searchForm">
      <div class="trip-planner" id="tripPlanner">
        <div class="trip-planner-header">
          <h3>Trip Planner</h3>
          <label class="trip-optimize-toggle">
            <input type="checkbox" id="optimizeToggle" />
            Optimize order
          </label>
        </div>

        <div class="trip-start-row">
          <span class="material-symbols-outlined" aria-hidden="true"
            >my_location</span
          >
          <span>Start: Current Location</span>
        </div>

        <div id="stopsContainer" class="stops-container"></div>

        <div class="trip-planner-actions">
          <button id="addStopBtn" type="button">Add Stop</button>
          <button type="submit">Get Route</button>
        </div>
      </div>
    </form>

    <div id="map" style="width: 100%; height: 500px; margin-top: 20px"></div>

    <div class="history">
      <button
        id="historyBtn"
        type="button"
        aria-expanded="false"
        aria-controls="historyPanel"
      >
        History
      </button>
    </div>

    <div id="historyPanel" class="history-panel" hidden>
      <div class="history-panel-header">
        <h3>Recent Trips</h3>
        <button
          id="historyCloseBtn"
          type="button"
          aria-label="Close history panel"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="history-panel-controls">
        <label for="historySort" class="history-sort-label">Sort</label>
        <select id="historySort" aria-label="Sort trip history">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
          <option value="highest">Highest CO₂</option>
          <option value="lowest">Lowest CO₂</option>
        </select>
      </div>
      <p id="historyTotalCo2">Total CO₂ Emissions: 0.00 kg</p>
      <p id="historyTripCount">Trips Saved: 0</p>
      <div id="historyList" class="history-list"></div>
      <div class="history-panel-actions">
        <button id="clearHistoryBtn" type="button">Clear All</button>
      </div>
    </div>

    <div id="historyBackdrop" class="history-backdrop" hidden></div>

    <div id="results" style="margin-top: 20px; text-align: center">
      <h3>Trip Details</h3>
      <p id="distanceText">Distance: --</p>
      <p id="durationText">Time: --</p>
      <p id="co2Text">CO₂ Emissions: --</p>
    </div>
    <div
      id="routesList"
      style="margin: 20px auto; max-width: 600px; text-align: left"
    ></div>

    <script>
      let map;
      let userLocation = null;
      let destinationLocation = null;

      let userMarker;
      let stopMarkers = [];

      const MAX_STOPS = 5;
      let stopIdCounter = 1;
      let dragStartStopId = null;
      let tripStops = [
        {
          id: stopIdCounter,
          label: "",
          lat: null,
          lng: null,
        },
      ];

      let carData = [];

      const fuelTypeMap = {
        X: "Regular Gasoline",
        Z: "Premium Gasoline",
        D: "Diesel",
        E: "Ethanol (E85)",
        N: "Natural Gas",
      };

      const profileToggleBtn = document.getElementById("profileToggleBtn");
      const profileMenu = document.getElementById("profileMenu");
      const historyBtn = document.getElementById("historyBtn");
      const historyPanel = document.getElementById("historyPanel");
      const historyBackdrop = document.getElementById("historyBackdrop");
      const historyCloseBtn = document.getElementById("historyCloseBtn");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");
      const historySortEl = document.getElementById("historySort");
      const historyListEl = document.getElementById("historyList");
      const historyTotalCo2El = document.getElementById("historyTotalCo2");
      const historyTripCountEl = document.getElementById("historyTripCount");
      const stopsContainerEl = document.getElementById("stopsContainer");
      const addStopBtn = document.getElementById("addStopBtn");
      const optimizeToggleEl = document.getElementById("optimizeToggle");

      const TRIP_HISTORY_KEY = "tripHistory";
      const HISTORY_LIMIT = 10;
      let lastHistoryTrigger = null;

      function setProfileMenuState(isOpen) {
        profileMenu.hidden = !isOpen;
        profileToggleBtn.setAttribute("aria-expanded", String(isOpen));
      }

      function setHistoryPanelState(isOpen, shouldReturnFocus = false) {
        historyPanel.hidden = !isOpen;
        historyBackdrop.hidden = !isOpen;
        historyBtn.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) {
          lastHistoryTrigger = document.activeElement;
          renderHistoryPanel();
          historySortEl.focus();
        } else if (shouldReturnFocus && lastHistoryTrigger) {
          lastHistoryTrigger.focus();
        }
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function toFiniteNumber(value, fallback = 0) {
        const parsed = Number(value);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function sanitizeHistoryEntry(entry) {
        if (!entry || typeof entry !== "object") return null;

        const distanceKm = toFiniteNumber(entry.distanceKm, 0);
        const distanceMiles = toFiniteNumber(
          entry.distanceMiles,
          distanceKm * 0.621371,
        );
        const co2Kg = toFiniteNumber(entry.co2Kg, 0);

        return {
          id:
            entry.id ||
            `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
          timestamp: (() => {
            const ts = entry.timestamp;
            const parsed = ts ? new Date(ts).getTime() : NaN;
            return Number.isFinite(parsed)
              ? new Date(parsed).toISOString()
              : new Date().toISOString();
          })(),
          destinationName: entry.destinationName || "Unknown destination",
          origin: entry.origin ?? null,
          destination: entry.destination ?? null,
          routeIndex: Number.isFinite(Number(entry.routeIndex))
            ? Number(entry.routeIndex)
            : null,
          stops: Array.isArray(entry.stops) ? entry.stops : [],
          optimizeOrder: Boolean(entry.optimizeOrder),
          duration: entry.duration || "--",
          vehicleLabel: entry.vehicleLabel || "Unknown vehicle",
          distanceKm,
          distanceMiles,
          co2Kg,
        };
      }

      function sortHistoryEntries(entries, sortBy) {
        const sorted = [...entries];
        if (sortBy === "oldest") {
          return sorted.sort(
            (a, b) =>
              new Date(a.timestamp).getTime() - new Date(b.timestamp).getTime(),
          );
        }
        if (sortBy === "highest") {
          return sorted.sort((a, b) => b.co2Kg - a.co2Kg);
        }
        if (sortBy === "lowest") {
          return sorted.sort((a, b) => a.co2Kg - b.co2Kg);
        }
        return sorted.sort(
          (a, b) =>
            new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime(),
        );
      }

      function getEmissionClass(co2Kg) {
        if (co2Kg >= 10) return "history-entry-high";
        if (co2Kg >= 5) return "history-entry-mid";
        return "history-entry-low";
      }

      function getTripHistory() {
        try {
          const raw = localStorage.getItem(TRIP_HISTORY_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .map((entry) => sanitizeHistoryEntry(entry))
            .filter((entry) => entry !== null);
        } catch (error) {
          console.warn("Could not load trip history:", error);
          return [];
        }
      }

      function setTripHistory(entries) {
        try {
          localStorage.setItem(TRIP_HISTORY_KEY, JSON.stringify(entries));
        } catch (error) {
          console.warn("Could not save trip history:", error);
        }
      }

      function calculateTotalCo2Kg(entries) {
        return entries.reduce((total, entry) => {
          const co2Kg = Number(entry.co2Kg);
          return total + (Number.isFinite(co2Kg) ? co2Kg : 0);
        }, 0);
      }

      function formatHistoryTimestamp(isoString) {
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "Unknown time";
        return date.toLocaleString();
      }

      function renderHistoryPanel() {
        const entries = getTripHistory();
        const sortedEntries = sortHistoryEntries(entries, historySortEl.value);
        const totalCo2Kg = calculateTotalCo2Kg(entries);

        historyTotalCo2El.textContent = `Total CO₂ Emissions: ${totalCo2Kg.toFixed(2)} kg`;
        historyTripCountEl.textContent = `Trips Saved: ${entries.length}`;

        if (sortedEntries.length === 0) {
          historyListEl.innerHTML =
            '<div class="history-empty"><span class="material-symbols-outlined" aria-hidden="true">route</span><p>No trips saved yet.</p><p class="history-empty-hint">Search a route to start tracking your emissions.</p></div>';
          return;
        }

        historyListEl.innerHTML = sortedEntries
          .map(
            (entry) => `
            <article class="history-entry ${getEmissionClass(entry.co2Kg)}" tabindex="0" aria-label="Trip to ${escapeHtml(entry.destinationName)} with ${entry.co2Kg.toFixed(2)} kilograms CO2">
              <p class="history-entry-destination">${escapeHtml(entry.destinationName)}</p>
              <p class="history-entry-emissions">${entry.co2Kg.toFixed(2)} kg CO₂</p>
              <p class="history-entry-meta">${entry.distanceMiles.toFixed(2)} mi (${entry.distanceKm.toFixed(2)} km) • ${escapeHtml(entry.duration)}</p>
              <p class="history-entry-meta">${entry.stops.length || 1} destination${(entry.stops.length || 1) > 1 ? "s" : ""} • ${entry.optimizeOrder ? "Optimized" : "Entered order"}</p>
              <p class="history-entry-vehicle">${escapeHtml(entry.vehicleLabel)}</p>
              <p class="history-entry-time">${formatHistoryTimestamp(entry.timestamp)}</p>
            </article>
          `,
          )
          .join("");
      }

      function saveTripToHistory(
        greenestRoute,
        destinationName,
        carSnapshot,
        stops,
        optimizeOrder,
      ) {
        const distanceKm = Number(greenestRoute.distance_km) || 0;
        const co2Kg = (Number(greenestRoute.co2_emissions_g) || 0) / 1000;
        const safeCar = carSnapshot || {};
        const newEntry = {
          id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
          timestamp: new Date().toISOString(),
          destinationName: destinationName || "Unknown destination",
          origin: userLocation,
          destination: destinationLocation,
          distanceKm,
          distanceMiles: distanceKm * 0.621371,
          duration: greenestRoute.duration || "--",
          co2Kg,
          routeIndex: greenestRoute.index,
          stops: Array.isArray(stops) ? stops : [],
          optimizeOrder: Boolean(optimizeOrder),
          vehicleLabel: `${safeCar.Make || "Unknown"} ${safeCar.Model || "Vehicle"} ${safeCar.EngineSize || "--"}L (${safeCar.FuelType || "--"})`,
        };

        const updatedHistory = [newEntry, ...getTripHistory()].slice(
          0,
          HISTORY_LIMIT,
        );

        setTripHistory(updatedHistory);
      }

      profileToggleBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setProfileMenuState(profileMenu.hidden);
      });

      profileMenu.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      historyBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setHistoryPanelState(historyPanel.hidden);
      });

      historyPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      historyBackdrop.addEventListener("click", function () {
        setHistoryPanelState(false, true);
      });

      historyCloseBtn.addEventListener("click", function () {
        setHistoryPanelState(false, true);
      });

      clearHistoryBtn.addEventListener("click", function () {
        const shouldClear = window.confirm(
          "Clear all saved trip history? This cannot be undone.",
        );
        if (!shouldClear) return;
        setTripHistory([]);
        renderHistoryPanel();
      });

      historySortEl.addEventListener("change", function () {
        renderHistoryPanel();
      });

      addStopBtn.addEventListener("click", function () {
        if (tripStops.length >= MAX_STOPS) return;
        tripStops.push(createEmptyStop());
        renderTripStops();
      });

      document.addEventListener("click", function () {
        setProfileMenuState(false);
        setHistoryPanelState(false);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !profileMenu.hidden) {
          setProfileMenuState(false);
          profileToggleBtn.focus();
        }
        if (event.key === "Escape" && !historyPanel.hidden) {
          setHistoryPanelState(false, true);
        }
      });

      async function loadCars() {
        const res = await fetch("/get-cars");
        carData = await res.json();

        populateMakeDropdown();
      }

      // 🔑 Load Google Maps dynamically with geometry and places libraries
      async function initMap() {
        const resp = await fetch("/get-api-key");
        const data = await resp.json();
        const apiKey = data.api_key;

        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry,places&callback=loadDefaultMap`;
        script.async = true;
        document.head.appendChild(script);
      }

      function createEmptyStop() {
        stopIdCounter += 1;
        return {
          id: stopIdCounter,
          label: "",
          lat: null,
          lng: null,
        };
      }

      function moveStop(fromIndex, toIndex) {
        if (
          fromIndex < 0 ||
          toIndex < 0 ||
          fromIndex >= tripStops.length ||
          toIndex >= tripStops.length ||
          fromIndex === toIndex
        ) {
          return;
        }

        const [moved] = tripStops.splice(fromIndex, 1);
        tripStops.splice(toIndex, 0, moved);
        renderTripStops();
      }

      function attachStopAutocomplete(inputEl, stopId) {
        if (!window.google || !window.google.maps || !window.google.maps.places)
          return;

        const autocomplete = new google.maps.places.Autocomplete(inputEl);
        autocomplete.setFields(["geometry", "name", "formatted_address"]);
        autocomplete.addListener("place_changed", function () {
          const place = autocomplete.getPlace();
          if (!place.geometry) return;

          const stopIndex = tripStops.findIndex((s) => s.id === stopId);
          if (stopIndex === -1) return;

          tripStops[stopIndex].label =
            place.formatted_address || place.name || inputEl.value;
          tripStops[stopIndex].lat = place.geometry.location.lat();
          tripStops[stopIndex].lng = place.geometry.location.lng();
          inputEl.value = tripStops[stopIndex].label;
        });
      }

      function renderTripStops() {
        stopsContainerEl.innerHTML = "";

        tripStops.forEach((stop, index) => {
          const row = document.createElement("div");
          row.className = "stop-row";
          row.draggable = true;
          row.dataset.stopId = String(stop.id);

          row.innerHTML = `
            <span class="material-symbols-outlined stop-drag" title="Drag to reorder" aria-hidden="true">drag_indicator</span>
            <span class="stop-index">${index + 1}.</span>
            <input type="search" class="stop-input" placeholder="Enter destination ${index + 1}" value="${escapeHtml(stop.label)}" aria-label="Destination ${index + 1}" />
            <div class="stop-row-actions">
              <button type="button" class="stop-move-up" aria-label="Move stop up">↑</button>
              <button type="button" class="stop-move-down" aria-label="Move stop down">↓</button>
              <button type="button" class="stop-remove" aria-label="Remove stop">✕</button>
            </div>
          `;

          const inputEl = row.querySelector(".stop-input");
          inputEl.addEventListener("input", function () {
            stop.label = inputEl.value;
            stop.lat = null;
            stop.lng = null;
          });
          attachStopAutocomplete(inputEl, stop.id);

          row
            .querySelector(".stop-remove")
            .addEventListener("click", function () {
              if (tripStops.length <= 1) {
                tripStops = [createEmptyStop()];
              } else {
                tripStops = tripStops.filter((s) => s.id !== stop.id);
              }
              renderTripStops();
            });

          row
            .querySelector(".stop-move-up")
            .addEventListener("click", function () {
              moveStop(index, index - 1);
            });

          row
            .querySelector(".stop-move-down")
            .addEventListener("click", function () {
              moveStop(index, index + 1);
            });

          row.addEventListener("dragstart", function () {
            dragStartStopId = stop.id;
            row.classList.add("dragging");
          });

          row.addEventListener("dragend", function () {
            row.classList.remove("dragging");
            dragStartStopId = null;
          });

          row.addEventListener("dragover", function (event) {
            event.preventDefault();
          });

          row.addEventListener("drop", function (event) {
            event.preventDefault();
            const fromIndex = tripStops.findIndex(
              (s) => s.id === dragStartStopId,
            );
            const toIndex = tripStops.findIndex((s) => s.id === stop.id);
            moveStop(fromIndex, toIndex);
          });

          stopsContainerEl.appendChild(row);
        });

        addStopBtn.disabled = tripStops.length >= MAX_STOPS;
      }

      async function resolveStopCoordinates(stop) {
        if (Number.isFinite(stop.lat) && Number.isFinite(stop.lng)) {
          return {
            lat: stop.lat,
            lng: stop.lng,
            name: stop.label || "Destination",
          };
        }

        if (!stop.label || !stop.label.trim()) {
          throw new Error("All stop fields need a destination");
        }

        const response = await fetch("/search-location", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: stop.label.trim() }),
        });
        const data = await response.json();

        if (data.error) {
          throw new Error(`Could not find: ${stop.label}`);
        }

        return {
          lat: data.lat,
          lng: data.lng,
          name: data.address || stop.label.trim(),
        };
      }

      async function getResolvedStops() {
        if (!tripStops.length) {
          throw new Error("Add at least one destination");
        }

        const activeStops = tripStops.filter(
          (s) => (s.label || "").trim().length > 0,
        );
        if (!activeStops.length) {
          throw new Error("Add at least one destination");
        }

        const resolvedStops = [];
        for (const stop of activeStops) {
          const resolved = await resolveStopCoordinates(stop);
          resolvedStops.push(resolved);
        }

        return resolvedStops;
      }

      function drawStopMarkers(stops) {
        stopMarkers.forEach((marker) => marker.setMap(null));
        stopMarkers = [];

        stops.forEach((stop, index) => {
          const marker = new google.maps.Marker({
            position: { lat: stop.lat, lng: stop.lng },
            map,
            title: stop.name || `Stop ${index + 1}`,
            label: String(index + 1),
          });
          stopMarkers.push(marker);
        });
      }

      // 🌍 Load map with user location and set up trip planner
      async function loadDefaultMap() {
        const fallback = { lat: 38.627, lng: -90.1994 }; // St. Louis

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              initMapWithLocation(userLocation);
              renderTripStops();
            },
            (error) => {
              console.warn("Geolocation failed:", error);
              initMapWithLocation(fallback);
              renderTripStops();
            },
          );
        } else {
          console.warn("Geolocation not supported");
          initMapWithLocation(fallback);
          renderTripStops();
        }
      }

      // 🗺️ Initialize map
      function initMapWithLocation(location) {
        map = new google.maps.Map(document.getElementById("map"), {
          center: location,
          zoom: 12,
        });

        userMarker = new google.maps.Marker({
          position: location,
          map: map,
          title: "You are here",
        });
      }

      // Calculate emissions based on distance and mode
      function calculateCO2(distanceMiles, transportType) {
        // Common emission factors (kg CO2 per mile)
        const emissionFactors = {
          car: 0.404, // kg C02 per mile (average gasoline car)
          bus: 0.089, // per passenger
          train: 0.041,
          bike: 0,
          walk: 0,
        };

        const factor = emissionFactors[transportType] || 0;
        return distanceMiles * factor;
      }

      // Populate car make dropdown
      function populateMakeDropdown() {
        const makes = [...new Set(carData.map((car) => car.Make))];

        const makeSelect = document.getElementById("Make");
        makeSelect.innerHTML = "<option>Select Make</option>";

        makes.forEach((Make) => {
          const option = document.createElement("option");
          option.value = Make;
          option.textContent = Make;
          makeSelect.appendChild(option);
        });
      }

      function getSelectedCar() {
        const make = document.getElementById("Make").value;
        const model = document.getElementById("Model").value;
        const engineSize = Number(document.getElementById("EngineSize").value);
        const fuelType = document.getElementById("FuelType").value;
        return {
          Make: make,
          Model: model,
          EngineSize: engineSize,
          FuelType: fuelType,
        };
      }

      function getSelectedCarEmission() {
        const { Make, Model, EngineSize, FuelType } = getSelectedCar();
        const car = carData.find(
          (c) =>
            c.Make === Make &&
            c.Model === Model &&
            Number(c.EngineSize) === EngineSize &&
            c.FuelType === FuelType,
        );
        return car ? car.CO2 : null;
      }

      function setProfileStatus(message, type) {
        const el = document.getElementById("profileStatus");
        el.textContent = message;
        el.style.color = type === "success" ? "green" : "red";
        setTimeout(() => {
          el.textContent = "";
        }, 5000);
      }

      // Save profile to localStorage
      function saveProfile() {
        const makeSelect = document.getElementById("Make");
        const modelSelect = document.getElementById("Model");
        const engineSizeSelect = document.getElementById("EngineSize");
        const fuelTypeSelect = document.getElementById("FuelType");

        const fuelValue = fuelTypeSelect.value;
        const fuelValid =
          fuelValue &&
          fuelValue !== "Select Fuel Type" &&
          fuelValue !== "No Fuel Type Found";

        if (
          makeSelect.selectedIndex <= 0 ||
          modelSelect.selectedIndex <= 0 ||
          engineSizeSelect.selectedIndex <= 0 ||
          !fuelValid
        ) {
          setProfileStatus("Select all car fields first.", "error");
          return;
        }

        const car = getSelectedCar();
        try {
          localStorage.setItem("userCarProfile", JSON.stringify(car));
          setProfileStatus("Profile saved!", "success");
        } catch (e) {
          setProfileStatus(
            "Could not save profile. Storage may be unavailable.",
            "error",
          );
        }
      }

      // Load profile from localStorage and set dropdowns
      function loadProfile() {
        const profile = localStorage.getItem("userCarProfile");
        if (!profile) return;
        try {
          const car = JSON.parse(profile);
          if (
            !car ||
            typeof car !== "object" ||
            !car.Make ||
            !car.Model ||
            !car.EngineSize ||
            !car.FuelType
          ) {
            throw new Error("Invalid profile data shape");
          }
          // Set Make and dispatch change to synchronously populate Model options
          document.getElementById("Make").value = car.Make;
          document.getElementById("Make").dispatchEvent(new Event("change"));
          // Set Model and dispatch change to synchronously populate EngineSize options
          document.getElementById("Model").value = car.Model;
          document.getElementById("Model").dispatchEvent(new Event("change"));
          // Set EngineSize and dispatch change to synchronously populate FuelType options
          document.getElementById("EngineSize").value = car.EngineSize;
          document
            .getElementById("EngineSize")
            .dispatchEvent(new Event("change"));
          // Set FuelType
          document.getElementById("FuelType").value = car.FuelType;
        } catch (e) {
          console.warn("Could not load car profile:", e);
          localStorage.removeItem("userCarProfile");
        }
      }

      // 🔍 Handle search
      document
        .getElementById("searchForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          try {
            if (!userLocation) {
              alert(
                "Waiting for current location. Please try again in a moment.",
              );
              return;
            }

            const selectedCar = getSelectedCar();
            const carEmissions = getSelectedCarEmission(); // grams per km
            if (!carEmissions) {
              document.getElementById("co2Text").textContent =
                `CO₂ Emissions: Select a vehicle first`;
              return;
            }

            const resolvedStops = await getResolvedStops();
            destinationLocation = {
              lat: resolvedStops[resolvedStops.length - 1].lat,
              lng: resolvedStops[resolvedStops.length - 1].lng,
            };

            const greenestResponse = await fetch("/get-greenest-route", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                origin: userLocation,
                stops: resolvedStops,
                optimize_order: optimizeToggleEl.checked,
                car_emissions: carEmissions,
              }),
            });

            const greenestData = await greenestResponse.json();

            if (!greenestData.error) {
              const greenest = greenestData.greenest;
              const distanceKm = greenest.distance_km;
              const distanceMiles = distanceKm * 0.621371;
              const co2Kg = greenest.co2_emissions_g / 1000;

              document.getElementById("distanceText").textContent =
                `Distance: ${distanceMiles.toFixed(2)} miles (${distanceKm.toFixed(2)} km)`;
              document.getElementById("durationText").textContent =
                `Time: ${greenest.duration}`;
              document.getElementById("co2Text").textContent =
                `CO₂ Emissions: ${co2Kg.toFixed(2)} kg`;

              const destinationName =
                resolvedStops[resolvedStops.length - 1].name || "Destination";
              saveTripToHistory(
                greenest,
                destinationName,
                selectedCar,
                resolvedStops,
                optimizeToggleEl.checked,
              );
              if (!historyPanel.hidden) {
                renderHistoryPanel();
              }

              drawStopMarkers(resolvedStops);

              const bounds = new google.maps.LatLngBounds();
              bounds.extend(userLocation);
              resolvedStops.forEach((stop) => bounds.extend(stop));
              map.fitBounds(bounds);

              const routes = greenestData.routes;
              const routesList = document.getElementById("routesList");
              routesList.innerHTML = `<h4>Route Options</h4>`;
              routes.forEach((route, idx) => {
                const isGreenest = route.index === greenest.index;
                const routeMiles = route.distance_km * 0.621371;
                const routeCo2Kg = route.co2_emissions_g / 1000;
                const extraKg = route.extra_emissions_g / 1000;
                const savingMsg = isGreenest
                  ? `<span style='color:green;font-weight:bold'>(Greenest Route)</span>`
                  : `<span style='color:#888'>+${extraKg.toFixed(2)} kg CO₂</span> <span style='color:#009900'>(Save ${extraKg.toFixed(2)} kg by choosing greenest)</span>`;
                const btnStyle = isGreenest
                  ? "background:#eaffea;border:2px solid #00b300;"
                  : "background:#f9f9f9;border:1px solid #ccc;";
                routesList.innerHTML += `
                  <div style="margin:10px 0;padding:10px;${btnStyle}border-radius:8px;cursor:pointer;" onclick="window.showRouteOnMap(${idx})">
                    <b>Route ${idx + 1}</b>: ${routeMiles.toFixed(2)} miles, ${route.duration}, <b>${routeCo2Kg.toFixed(2)} kg CO₂</b> ${savingMsg}
                  </div>
                `;
              });

              if (window.routePolylines) {
                window.routePolylines.forEach((p) => p.setMap(null));
              }
              window.routePolylines = [];
              routes.forEach((route, idx) => {
                if (route.polyline && map) {
                  const polyline = new google.maps.Polyline({
                    path: google.maps.geometry.encoding.decodePath(
                      route.polyline,
                    ),
                    geodesic: true,
                    strokeColor: idx === greenest.index ? "#00b300" : "#888",
                    strokeOpacity: idx === greenest.index ? 1.0 : 0.5,
                    strokeWeight: idx === greenest.index ? 7 : 4,
                    zIndex: idx === greenest.index ? 2 : 1,
                  });
                  polyline.setMap(map);
                  window.routePolylines.push(polyline);
                }
              });

              window.showRouteOnMap = function (idx) {
                routes.forEach((route, i) => {
                  if (window.routePolylines && window.routePolylines[i]) {
                    window.routePolylines[i].setOptions({
                      strokeColor:
                        i === idx
                          ? "#0077ff"
                          : i === greenest.index
                            ? "#00b300"
                            : "#888",
                      strokeOpacity:
                        i === idx ? 1.0 : i === greenest.index ? 1.0 : 0.5,
                      strokeWeight:
                        i === idx ? 8 : i === greenest.index ? 7 : 4,
                      zIndex: i === idx ? 3 : i === greenest.index ? 2 : 1,
                    });
                  }
                });
                const route = routes[idx];
                const routeMiles = route.distance_km * 0.621371;
                const routeCo2Kg = route.co2_emissions_g / 1000;
                document.getElementById("distanceText").textContent =
                  `Distance: ${routeMiles.toFixed(2)} miles (${route.distance_km.toFixed(2)} km)`;
                document.getElementById("durationText").textContent =
                  `Time: ${route.duration}`;
                document.getElementById("co2Text").textContent =
                  `CO₂ Emissions: ${routeCo2Kg.toFixed(2)} kg`;
              };

              window.showRouteOnMap(greenest.index);
            } else {
              document.getElementById("distanceText").textContent =
                `Distance: --`;
              document.getElementById("durationText").textContent = `Time: --`;
              document.getElementById("co2Text").textContent =
                `CO₂ Emissions: --`;
              document.getElementById("routesList").innerHTML = "";
              alert(greenestData.error);
            }
          } catch (err) {
            console.error(err);
            alert(err.message || "Error searching route");
          }
        });

      document
        .getElementById("saveProfileBtn")
        .addEventListener("click", saveProfile);

      document.getElementById("Make").addEventListener("change", function () {
        const selectedMake = this.value;

        const models = [
          ...new Set(
            carData
              .filter((car) => car.Make === selectedMake)
              .map((car) => car.Model),
          ),
        ];

        const modelSelect = document.getElementById("Model");
        modelSelect.innerHTML = "<option>Select Model</option>";

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
      });

      document.getElementById("Model").addEventListener("change", function () {
        const selectedMake = document.getElementById("Make").value;
        const selectedModel = this.value;

        const engineSizes = [
          ...new Set(
            carData
              .filter(
                (car) =>
                  car.Make === selectedMake && car.Model === selectedModel,
              )
              .map((car) => car.EngineSize),
          ),
        ];

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        engineSizes.forEach((size) => {
          const option = document.createElement("option");
          option.value = size;
          option.textContent = size;
          engineSizeSelect.appendChild(option);
        });
      });

      document
        .getElementById("EngineSize")
        .addEventListener("change", function () {
          const selectedMake = document.getElementById("Make").value;
          const selectedModel = document.getElementById("Model").value;
          const selectedEngineSize = Number(this.value);

          const fuelTypes = [
            ...new Set(
              carData
                .filter(
                  (car) =>
                    car.Make === selectedMake &&
                    car.Model === selectedModel &&
                    Number(car.EngineSize) === selectedEngineSize,
                )
                .map((car) => car.FuelType),
            ),
          ];

          const fuelTypeSelect = document.getElementById("FuelType");
          fuelTypeSelect.innerHTML = "";

          if (fuelTypes.length === 0) {
            fuelTypeSelect.innerHTML = "<option>No Fuel Type Found</option>";
            fuelTypeSelect.disabled = true;
            return;
          }

          if (fuelTypes.length === 1) {
            const onlyFuel = fuelTypes[0];
            const upperFuel = onlyFuel.toUpperCase();
            fuelTypeSelect.innerHTML = `<option value="${onlyFuel}">${fuelTypeMap[upperFuel] || onlyFuel}</option>`;
            fuelTypeSelect.disabled = true;
            return;
          }

          fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
          fuelTypeSelect.disabled = false;

          fuelTypes.forEach((type) => {
            const upperType = type.toUpperCase();
            const option = document.createElement("option");
            option.value = type;
            option.textContent = fuelTypeMap[upperType] || type;
            fuelTypeSelect.appendChild(option);
          });
        });

      // 🚀 Start everything
      window.onload = async () => {
        initMap();
        await loadCars();
        loadProfile();
        renderHistoryPanel();
      };
    </script>
  </body>
</html>
