<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Leaf</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div class="title">
      <h1>Green Leaf</h1>
    </div>

    <hr />

    <form>
      <div class="profile">
        <button
          class="accicon"
          type="button"
          id="profileToggleBtn"
          aria-haspopup="true"
          aria-expanded="false"
          aria-controls="profileMenu"
        >
          <span class="material-symbols-outlined">account_circle</span>
        </button>

        <div id="profileMenu" class="profile-menu" hidden>
          <h3>Vehicle Profile</h3>
          <div id="carSelector">
            <select id="Make"></select>
            <select id="Model"></select>
            <select id="EngineSize"></select>
            <select id="FuelType"></select>
            <button id="saveProfileBtn" type="button" style="margin-left: 10px">
              Save Profile
            </button>
            <span
              id="profileStatus"
              role="status"
              aria-live="polite"
              style="margin-left: 10px; font-size: 0.95em"
            ></span>
          </div>
        </div>
      </div>
    </form>

    <form class="ser" id="searchForm">
      <div class="search">
        <span class="material-symbols-outlined">search</span>
        <input
          class="search-input"
          type="search"
          id="searchInput"
          placeholder="Search"
        />
        <button type="submit">Go</button>
      </div>
    </form>

    <div id="map" style="width: 100%; height: 500px; margin-top: 20px"></div>

    <div class="history">
      <button
        id="historyBtn"
        type="button"
        aria-expanded="false"
        aria-controls="historyPanel"
      >
        History
      </button>
    </div>

    <div id="historyPanel" class="history-panel" hidden>
      <div class="history-panel-header">
        <h3>Recent Trips</h3>
        <button
          id="historyCloseBtn"
          type="button"
          aria-label="Close history panel"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <p id="historyTotalCo2">Total CO₂ Emissions: 0.00 kg</p>
      <div id="historyList" class="history-list"></div>
      <div class="history-panel-actions">
        <button id="clearHistoryBtn" type="button">Clear All</button>
      </div>
    </div>

    <div id="results" style="margin-top: 20px; text-align: center">
      <h3>Trip Details</h3>
      <p id="distanceText">Distance: --</p>
      <p id="durationText">Time: --</p>
      <p id="co2Text">CO₂ Emissions: --</p>
    </div>
    <div
      id="routesList"
      style="margin: 20px auto; max-width: 600px; text-align: left"
    ></div>

    <script>
      let map;
      let userLocation = null;
      let destinationLocation = null;

      let userMarker;
      let destinationMarker;

      let carData = [];

      const fuelTypeMap = {
        X: "Regular Gasoline",
        Z: "Premium Gasoline",
        D: "Diesel",
        E: "Ethanol (E85)",
        N: "Natural Gas",
      };

      const profileToggleBtn = document.getElementById("profileToggleBtn");
      const profileMenu = document.getElementById("profileMenu");
      const historyBtn = document.getElementById("historyBtn");
      const historyPanel = document.getElementById("historyPanel");
      const historyCloseBtn = document.getElementById("historyCloseBtn");
      const clearHistoryBtn = document.getElementById("clearHistoryBtn");
      const historyListEl = document.getElementById("historyList");
      const historyTotalCo2El = document.getElementById("historyTotalCo2");

      const TRIP_HISTORY_KEY = "tripHistory";
      const HISTORY_LIMIT = 10;

      function setProfileMenuState(isOpen) {
        profileMenu.hidden = !isOpen;
        profileToggleBtn.setAttribute("aria-expanded", String(isOpen));
      }

      function setHistoryPanelState(isOpen) {
        historyPanel.hidden = !isOpen;
        historyBtn.setAttribute("aria-expanded", String(isOpen));
        if (isOpen) {
          renderHistoryPanel();
        }
      }

      function getTripHistory() {
        try {
          const raw = localStorage.getItem(TRIP_HISTORY_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
          console.warn("Could not load trip history:", error);
          return [];
        }
      }

      function setTripHistory(entries) {
        try {
          localStorage.setItem(TRIP_HISTORY_KEY, JSON.stringify(entries));
        } catch (error) {
          console.warn("Could not save trip history:", error);
        }
      }

      function calculateTotalCo2Kg(entries) {
        return entries.reduce((total, entry) => {
          const co2Kg = Number(entry.co2Kg);
          return total + (Number.isFinite(co2Kg) ? co2Kg : 0);
        }, 0);
      }

      function formatHistoryTimestamp(isoString) {
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return "Unknown time";
        return date.toLocaleString();
      }

      function renderHistoryPanel() {
        const entries = getTripHistory();
        const totalCo2Kg = calculateTotalCo2Kg(entries);

        historyTotalCo2El.textContent = `Total CO₂ Emissions: ${totalCo2Kg.toFixed(2)} kg`;

        if (entries.length === 0) {
          historyListEl.innerHTML =
            '<p class="history-empty">No trips saved yet. Search a route to start tracking.</p>';
          return;
        }

        historyListEl.innerHTML = entries
          .map(
            (entry) => `
            <article class="history-entry">
              <p class="history-entry-time">${formatHistoryTimestamp(entry.timestamp)}</p>
              <p class="history-entry-destination">To: ${entry.destinationName || "Unknown destination"}</p>
              <p>${entry.distanceMiles.toFixed(2)} mi (${entry.distanceKm.toFixed(2)} km) • ${entry.duration}</p>
              <p><strong>${entry.co2Kg.toFixed(2)} kg CO₂</strong> • ${entry.vehicleLabel}</p>
            </article>
          `,
          )
          .join("");
      }

      function saveTripToHistory(greenestRoute, destinationName, carSnapshot) {
        const distanceKm = Number(greenestRoute.distance_km) || 0;
        const co2Kg = (Number(greenestRoute.co2_emissions_g) || 0) / 1000;
        const newEntry = {
          id: `${Date.now()}-${Math.random().toString(16).slice(2, 8)}`,
          timestamp: new Date().toISOString(),
          destinationName: destinationName || "Unknown destination",
          origin: userLocation,
          destination: destinationLocation,
          distanceKm,
          distanceMiles: distanceKm * 0.621371,
          duration: greenestRoute.duration || "--",
          co2Kg,
          routeIndex: greenestRoute.index,
          vehicleLabel: `${carSnapshot.Make} ${carSnapshot.Model} ${carSnapshot.EngineSize}L (${carSnapshot.FuelType})`,
        };

        const updatedHistory = [newEntry, ...getTripHistory()].slice(
          0,
          HISTORY_LIMIT,
        );

        setTripHistory(updatedHistory);
      }

      profileToggleBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setProfileMenuState(profileMenu.hidden);
      });

      profileMenu.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      historyBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        setHistoryPanelState(historyPanel.hidden);
      });

      historyPanel.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      historyCloseBtn.addEventListener("click", function () {
        setHistoryPanelState(false);
      });

      clearHistoryBtn.addEventListener("click", function () {
        setTripHistory([]);
        renderHistoryPanel();
      });

      document.addEventListener("click", function () {
        setProfileMenuState(false);
        setHistoryPanelState(false);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && !profileMenu.hidden) {
          setProfileMenuState(false);
          profileToggleBtn.focus();
        }
        if (event.key === "Escape" && !historyPanel.hidden) {
          setHistoryPanelState(false);
          historyBtn.focus();
        }
      });

      async function loadCars() {
        const res = await fetch("/get-cars");
        carData = await res.json();

        populateMakeDropdown();
      }

      // 🔑 Load Google Maps dynamically with geometry and places libraries
      async function initMap() {
        const resp = await fetch("/get-api-key");
        const data = await resp.json();
        const apiKey = data.api_key;

        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=geometry,places&callback=loadDefaultMap`;
        script.async = true;
        document.head.appendChild(script);
      }

      // 🌍 Load map with user location and set up Places Autocomplete
      async function loadDefaultMap() {
        const fallback = { lat: 38.627, lng: -90.1994 }; // St. Louis

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };
              initMapWithLocation(userLocation);
              setupAutocomplete();
            },
            (error) => {
              console.warn("Geolocation failed:", error);
              initMapWithLocation(fallback);
              setupAutocomplete();
            },
          );
        } else {
          console.warn("Geolocation not supported");
          initMapWithLocation(fallback);
          setupAutocomplete();
        }
      }

      // Set up Google Places Autocomplete on the search bar
      function setupAutocomplete() {
        if (!window.google || !window.google.maps || !window.google.maps.places)
          return;
        const input = document.getElementById("searchInput");
        const autocomplete = new google.maps.places.Autocomplete(input);
        autocomplete.setFields(["geometry", "name", "formatted_address"]);
        autocomplete.addListener("place_changed", function () {
          const place = autocomplete.getPlace();
          if (!place.geometry) return;
          // Set destinationLocation and trigger the rest of the search logic
          destinationLocation = {
            lat: place.geometry.location.lat(),
            lng: place.geometry.location.lng(),
          };
          // Place/update destination marker
          if (destinationMarker) {
            destinationMarker.setPosition(destinationLocation);
          } else {
            destinationMarker = new google.maps.Marker({
              position: destinationLocation,
              map: map,
              title: "Destination",
            });
          }
          map.setCenter(destinationLocation);
          map.setZoom(14);
          // Optionally, auto-submit the form to trigger route search
          document
            .getElementById("searchForm")
            .dispatchEvent(new Event("submit"));
        });
      }

      // 🗺️ Initialize map
      function initMapWithLocation(location) {
        map = new google.maps.Map(document.getElementById("map"), {
          center: location,
          zoom: 12,
        });

        userMarker = new google.maps.Marker({
          position: location,
          map: map,
          title: "You are here",
        });
      }

      // Calculate emissions based on distance and mode
      function calculateCO2(distanceMiles, transportType) {
        // Common emission factors (kg CO2 per mile)
        const emissionFactors = {
          car: 0.404, // kg C02 per mile (average gasoline car)
          bus: 0.089, // per passenger
          train: 0.041,
          bike: 0,
          walk: 0,
        };

        const factor = emissionFactors[transportType] || 0;
        return distanceMiles * factor;
      }

      // Populate car make dropdown
      function populateMakeDropdown() {
        const makes = [...new Set(carData.map((car) => car.Make))];

        const makeSelect = document.getElementById("Make");
        makeSelect.innerHTML = "<option>Select Make</option>";

        makes.forEach((Make) => {
          const option = document.createElement("option");
          option.value = Make;
          option.textContent = Make;
          makeSelect.appendChild(option);
        });
      }

      function getSelectedCar() {
        const make = document.getElementById("Make").value;
        const model = document.getElementById("Model").value;
        const engineSize = Number(document.getElementById("EngineSize").value);
        const fuelType = document.getElementById("FuelType").value;
        return {
          Make: make,
          Model: model,
          EngineSize: engineSize,
          FuelType: fuelType,
        };
      }

      function getSelectedCarEmission() {
        const { Make, Model, EngineSize, FuelType } = getSelectedCar();
        const car = carData.find(
          (c) =>
            c.Make === Make &&
            c.Model === Model &&
            Number(c.EngineSize) === EngineSize &&
            c.FuelType === FuelType,
        );
        return car ? car.CO2 : null;
      }

      function setProfileStatus(message, type) {
        const el = document.getElementById("profileStatus");
        el.textContent = message;
        el.style.color = type === "success" ? "green" : "red";
        setTimeout(() => {
          el.textContent = "";
        }, 5000);
      }

      // Save profile to localStorage
      function saveProfile() {
        const makeSelect = document.getElementById("Make");
        const modelSelect = document.getElementById("Model");
        const engineSizeSelect = document.getElementById("EngineSize");
        const fuelTypeSelect = document.getElementById("FuelType");

        const fuelValue = fuelTypeSelect.value;
        const fuelValid =
          fuelValue &&
          fuelValue !== "Select Fuel Type" &&
          fuelValue !== "No Fuel Type Found";

        if (
          makeSelect.selectedIndex <= 0 ||
          modelSelect.selectedIndex <= 0 ||
          engineSizeSelect.selectedIndex <= 0 ||
          !fuelValid
        ) {
          setProfileStatus("Select all car fields first.", "error");
          return;
        }

        const car = getSelectedCar();
        try {
          localStorage.setItem("userCarProfile", JSON.stringify(car));
          setProfileStatus("Profile saved!", "success");
        } catch (e) {
          setProfileStatus(
            "Could not save profile. Storage may be unavailable.",
            "error",
          );
        }
      }

      // Load profile from localStorage and set dropdowns
      function loadProfile() {
        const profile = localStorage.getItem("userCarProfile");
        if (!profile) return;
        try {
          const car = JSON.parse(profile);
          if (
            !car ||
            typeof car !== "object" ||
            !car.Make ||
            !car.Model ||
            !car.EngineSize ||
            !car.FuelType
          ) {
            throw new Error("Invalid profile data shape");
          }
          // Set Make and dispatch change to synchronously populate Model options
          document.getElementById("Make").value = car.Make;
          document.getElementById("Make").dispatchEvent(new Event("change"));
          // Set Model and dispatch change to synchronously populate EngineSize options
          document.getElementById("Model").value = car.Model;
          document.getElementById("Model").dispatchEvent(new Event("change"));
          // Set EngineSize and dispatch change to synchronously populate FuelType options
          document.getElementById("EngineSize").value = car.EngineSize;
          document
            .getElementById("EngineSize")
            .dispatchEvent(new Event("change"));
          // Set FuelType
          document.getElementById("FuelType").value = car.FuelType;
        } catch (e) {
          console.warn("Could not load car profile:", e);
          localStorage.removeItem("userCarProfile");
        }
      }

      // 🔍 Handle search
      document
        .getElementById("searchForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const query = document.getElementById("searchInput").value;

          if (!query) {
            alert("Please enter a location");
            return;
          }

          try {
            const response = await fetch("/search-location", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: query }),
            });

            const data = await response.json();

            if (data.error) {
              alert(data.error);
              return;
            }

            // 📍 Set destination
            destinationLocation = {
              lat: data.lat,
              lng: data.lng,
            };

            // Place/update destination marker
            if (destinationMarker) {
              destinationMarker.setPosition(destinationLocation);
            } else {
              destinationMarker = new google.maps.Marker({
                position: destinationLocation,
                map: map,
                title: "Destination",
              });
            }

            map.setCenter(destinationLocation);
            map.setZoom(14);

            // 📏 Calculate greenest route
            if (userLocation) {
              const selectedCar = getSelectedCar();
              const carEmissions = getSelectedCarEmission(); // grams per km
              if (!carEmissions) {
                document.getElementById("co2Text").textContent =
                  `CO₂ Emissions: Select a vehicle first`;
                return;
              }

              const greenestResponse = await fetch("/get-greenest-route", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  origin: userLocation,
                  destination: destinationLocation,
                  car_emissions: carEmissions, // grams per km
                }),
              });

              const greenestData = await greenestResponse.json();

              if (!greenestData.error) {
                // Show the greenest route in the summary
                const greenest = greenestData.greenest;
                const distanceKm = greenest.distance_km;
                const distanceMiles = distanceKm * 0.621371;
                const co2Kg = greenest.co2_emissions_g / 1000;

                document.getElementById("distanceText").textContent =
                  `Distance: ${distanceMiles.toFixed(2)} miles (${distanceKm.toFixed(2)} km)`;
                document.getElementById("durationText").textContent =
                  `Time: ${greenest.duration}`;
                document.getElementById("co2Text").textContent =
                  `CO₂ Emissions: ${co2Kg.toFixed(2)} kg`;

                saveTripToHistory(greenest, query, selectedCar);
                if (!historyPanel.hidden) {
                  renderHistoryPanel();
                }

                // Show all route options
                const routes = greenestData.routes;
                const routesList = document.getElementById("routesList");
                routesList.innerHTML = `<h4>Route Options</h4>`;
                routes.forEach((route, idx) => {
                  const isGreenest = route.index === greenest.index;
                  const routeMiles = route.distance_km * 0.621371;
                  const routeCo2Kg = route.co2_emissions_g / 1000;
                  const extraKg = route.extra_emissions_g / 1000;
                  const savingMsg = isGreenest
                    ? `<span style='color:green;font-weight:bold'>(Greenest Route)</span>`
                    : `<span style='color:#888'>+${extraKg.toFixed(2)} kg CO₂</span> <span style='color:#009900'>(Save ${extraKg.toFixed(2)} kg by choosing greenest)</span>`;
                  const btnStyle = isGreenest
                    ? "background:#eaffea;border:2px solid #00b300;"
                    : "background:#f9f9f9;border:1px solid #ccc;";
                  routesList.innerHTML += `
                    <div style="margin:10px 0;padding:10px;${btnStyle}border-radius:8px;cursor:pointer;" onclick="window.showRouteOnMap(${idx})">
                      <b>Route ${idx + 1}</b>: ${routeMiles.toFixed(2)} miles, ${route.duration}, <b>${routeCo2Kg.toFixed(2)} kg CO₂</b> ${savingMsg}
                    </div>
                  `;
                });

                // Draw all routes on the map, highlight greenest
                if (window.routePolylines) {
                  window.routePolylines.forEach((p) => p.setMap(null));
                }
                window.routePolylines = [];
                routes.forEach((route, idx) => {
                  if (route.polyline && map) {
                    const polyline = new google.maps.Polyline({
                      path: google.maps.geometry.encoding.decodePath(
                        route.polyline,
                      ),
                      geodesic: true,
                      strokeColor: idx === greenest.index ? "#00b300" : "#888",
                      strokeOpacity: idx === greenest.index ? 1.0 : 0.5,
                      strokeWeight: idx === greenest.index ? 7 : 4,
                      zIndex: idx === greenest.index ? 2 : 1,
                    });
                    polyline.setMap(map);
                    window.routePolylines.push(polyline);
                  }
                });

                // Click handler: update summary and highlight selected route
                window.showRouteOnMap = function (idx) {
                  routes.forEach((route, i) => {
                    if (window.routePolylines && window.routePolylines[i]) {
                      window.routePolylines[i].setOptions({
                        strokeColor:
                          i === idx
                            ? "#0077ff"
                            : i === greenest.index
                              ? "#00b300"
                              : "#888",
                        strokeOpacity:
                          i === idx ? 1.0 : i === greenest.index ? 1.0 : 0.5,
                        strokeWeight:
                          i === idx ? 8 : i === greenest.index ? 7 : 4,
                        zIndex: i === idx ? 3 : i === greenest.index ? 2 : 1,
                      });
                    }
                  });
                  const route = routes[idx];
                  const routeMiles = route.distance_km * 0.621371;
                  const routeCo2Kg = route.co2_emissions_g / 1000;
                  document.getElementById("distanceText").textContent =
                    `Distance: ${routeMiles.toFixed(2)} miles (${route.distance_km.toFixed(2)} km)`;
                  document.getElementById("durationText").textContent =
                    `Time: ${route.duration}`;
                  document.getElementById("co2Text").textContent =
                    `CO₂ Emissions: ${routeCo2Kg.toFixed(2)} kg`;
                };
                // Highlight greenest route by default
                window.showRouteOnMap(greenest.index);
              } else {
                document.getElementById("distanceText").textContent =
                  `Distance: --`;
                document.getElementById("durationText").textContent =
                  `Time: --`;
                document.getElementById("co2Text").textContent =
                  `CO₂ Emissions: --`;
                document.getElementById("routesList").innerHTML = "";
                alert(greenestData.error);
              }
            }
          } catch (err) {
            console.error(err);
            alert("Error searching location");
          }
        });

      document
        .getElementById("saveProfileBtn")
        .addEventListener("click", saveProfile);

      document.getElementById("Make").addEventListener("change", function () {
        const selectedMake = this.value;

        const models = [
          ...new Set(
            carData
              .filter((car) => car.Make === selectedMake)
              .map((car) => car.Model),
          ),
        ];

        const modelSelect = document.getElementById("Model");
        modelSelect.innerHTML = "<option>Select Model</option>";

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
      });

      document.getElementById("Model").addEventListener("change", function () {
        const selectedMake = document.getElementById("Make").value;
        const selectedModel = this.value;

        const engineSizes = [
          ...new Set(
            carData
              .filter(
                (car) =>
                  car.Make === selectedMake && car.Model === selectedModel,
              )
              .map((car) => car.EngineSize),
          ),
        ];

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        engineSizes.forEach((size) => {
          const option = document.createElement("option");
          option.value = size;
          option.textContent = size;
          engineSizeSelect.appendChild(option);
        });
      });

      document
        .getElementById("EngineSize")
        .addEventListener("change", function () {
          const selectedMake = document.getElementById("Make").value;
          const selectedModel = document.getElementById("Model").value;
          const selectedEngineSize = Number(this.value);

          const fuelTypes = [
            ...new Set(
              carData
                .filter(
                  (car) =>
                    car.Make === selectedMake &&
                    car.Model === selectedModel &&
                    Number(car.EngineSize) === selectedEngineSize,
                )
                .map((car) => car.FuelType),
            ),
          ];

          const fuelTypeSelect = document.getElementById("FuelType");
          fuelTypeSelect.innerHTML = "";

          if (fuelTypes.length === 0) {
            fuelTypeSelect.innerHTML = "<option>No Fuel Type Found</option>";
            fuelTypeSelect.disabled = true;
            return;
          }

          if (fuelTypes.length === 1) {
            const onlyFuel = fuelTypes[0];
            const upperFuel = onlyFuel.toUpperCase();
            fuelTypeSelect.innerHTML = `<option value="${onlyFuel}">${fuelTypeMap[upperFuel] || onlyFuel}</option>`;
            fuelTypeSelect.disabled = true;
            return;
          }

          fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
          fuelTypeSelect.disabled = false;

          fuelTypes.forEach((type) => {
            const upperType = type.toUpperCase();
            const option = document.createElement("option");
            option.value = type;
            option.textContent = fuelTypeMap[upperType] || type;
            fuelTypeSelect.appendChild(option);
          });
        });

      // 🚀 Start everything
      window.onload = async () => {
        initMap();
        await loadCars();
        loadProfile();
        renderHistoryPanel();
      };
    </script>
  </body>
</html>
