<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Leaf</title>
    <link rel="stylesheet" href="style.css">
     
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>
<body>


    <div class="title"> 
        <h1>Green Leaf  </h1>
    </div>
    
    <hr>  

    <form>
        <div class="profile">
        <button class="accicon"><span class="acc-icon material-symbols-outlined">account_circle</span></button>
    </div>
    

    </form>
    

    <form class="ser" id="searchForm">
        <div class="search">
            <span class="  search-icon material-symbols-outlined"> search </span>
            <input class="search-input" type="search" id="searchInput" placeholder="Search">  
            <button type="submit">Go</button>
        </div>
    </form>
    

    <div class="history">
        <button>History</button>
    </div>

    <script>
        document.getElementById("searchForm").addEventListener("submit", async function(e) {
            e.preventDefault(); // Prevent form from reloading the page

            const query = document.getElementById("searchInput").value;

            if (!query) {
                alert("Please enter a location");
                return;
            }

            try {
                // Send search query to backend
                const response = await fetch("/search-location", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query: query})
                });

                const data = await response.json();
                console.log("Search result:", data);

                if (data.error) {
                    alert(data.error);
                } else {
                    alert(`Location found: ${data.address}\nLatitude: ${data.lat}, Longitude: ${data.lng}`);
                    // Update map or CO2 calculations here
                }
            } catch (err) {
                console.error(err);
                alert("Error searching location");
            }
        });
    </script>
    
</body>
</html>
