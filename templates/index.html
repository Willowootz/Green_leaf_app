<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Green Leaf</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>

  <body>
    <div class="title">
      <h1>Green Leaf</h1>
    </div>

    <hr />

    <form>
      <div class="profile">
        <button class="accicon">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
      </div>
    </form>

    <form class="ser" id="searchForm">
      <div class="search">
        <span class="material-symbols-outlined">search</span>
        <input
          class="search-input"
          type="search"
          id="searchInput"
          placeholder="Search"
        />
        <button type="submit">Go</button>
      </div>
    </form>

    <div id="map" style="width: 100%; height: 500px; margin-top: 20px"></div>

    <div class="history">
      <button>History</button>
    </div>

    <div id="carSelector">
      <select id="Make"></select>
      <select id="Model"></select>
      <select id="EngineSize"></select>
      <select id="FuelType"></select>
    </div>

    <div id="results" style="margin-top: 20px; text-align: center">
      <h3>Trip Details</h3>
      <p id="distanceText">Distance: --</p>
      <p id="durationText">Time: --</p>
      <p id="co2Text">CO₂ Emissions: --</p>
    </div>

    <script>
      let map;
      let userLocation = null;
      let destinationLocation = null;

      let userMarker;
      let destinationMarker;

      let carData = [];

      const fuelTypeMap = {
        X: "Regular Gasoline",
        Z: "Premium Gasoline",
        D: "Diesel",
        E: "Ethanol (E85)",
        N: "Natural Gas",
      };

      async function loadCars() {
        const res = await fetch("/get-cars");
        carData = await res.json();

        populateMakeDropdown();
      }

      // 🔑 Load Google Maps dynamically
      async function initMap() {
        const resp = await fetch("/get-api-key");
        const data = await resp.json();
        const apiKey = data.api_key;

        const script = document.createElement("script");
        script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&callback=loadDefaultMap`;
        script.async = true;
        document.head.appendChild(script);
      }

      // 🌍 Load map with user location
      async function loadDefaultMap() {
        const fallback = { lat: 38.627, lng: -90.1994 }; // St. Louis

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            (position) => {
              userLocation = {
                lat: position.coords.latitude,
                lng: position.coords.longitude,
              };

              initMapWithLocation(userLocation);
            },
            (error) => {
              console.warn("Geolocation failed:", error);
              initMapWithLocation(fallback);
            },
          );
        } else {
          console.warn("Geolocation not supported");
          initMapWithLocation(fallback);
        }
      }

      // 🗺️ Initialize map
      function initMapWithLocation(location) {
        map = new google.maps.Map(document.getElementById("map"), {
          center: location,
          zoom: 12,
        });

        userMarker = new google.maps.Marker({
          position: location,
          map: map,
          title: "You are here",
        });
      }

      // Calculate emissions based on distance and mode
      function calculateCO2(distanceMiles, transportType) {
        // Common emission factors (kg CO2 per mile)
        const emissionFactors = {
          car: 0.404, // kg C02 per mile (average gasoline car)
          bus: 0.089, // per passenger
          train: 0.041,
          bike: 0,
          walk: 0,
        };

        const factor = emissionFactors[transportType] || 0;
        return distanceMiles * factor;
      }

      // Populate car make dropdown
      function populateMakeDropdown() {
        const makes = [...new Set(carData.map((car) => car.Make))];

        const makeSelect = document.getElementById("Make");
        makeSelect.innerHTML = "<option>Select Make</option>";

        makes.forEach((Make) => {
          const option = document.createElement("option");
          option.value = Make;
          option.textContent = Make;
          makeSelect.appendChild(option);
        });
      }

      function getSelectedCarEmission() {
        const make = document.getElementById("Make").value;
        const model = document.getElementById("Model").value;
        const engineSize = Number(document.getElementById("EngineSize").value);
        const fuelType = document.getElementById("FuelType").value;

        const car = carData.find(
          (c) =>
            c.Make === make &&
            c.Model === model &&
            Number(c.EngineSize) === engineSize &&
            c.FuelType === fuelType,
        );

        return car ? car.CO2 : null;
      }

      // 🔍 Handle search
      document
        .getElementById("searchForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();

          const query = document.getElementById("searchInput").value;

          if (!query) {
            alert("Please enter a location");
            return;
          }

          try {
            const response = await fetch("/search-location", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ query: query }),
            });

            const data = await response.json();

            if (data.error) {
              alert(data.error);
              return;
            }

            // 📍 Set destination
            destinationLocation = {
              lat: data.lat,
              lng: data.lng,
            };

            // Place/update destination marker
            if (destinationMarker) {
              destinationMarker.setPosition(destinationLocation);
            } else {
              destinationMarker = new google.maps.Marker({
                position: destinationLocation,
                map: map,
                title: "Destination",
              });
            }

            map.setCenter(destinationLocation);
            map.setZoom(14);

            // 📏 Calculate distance
            if (userLocation) {
              const distanceResponse = await fetch("/get-distance", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  origin: userLocation,
                  destination: destinationLocation,
                }),
              });

              const distanceData = await distanceResponse.json();

              if (!distanceData.error) {
                const distanceMiles = distanceData.distance_value_miles;

                const emissionPerMile = getSelectedCarEmission();

                if (emissionPerMile) {
                  const totalCO2 = emissionPerMile * distanceMiles;

                  document.getElementById("co2Text").textContent =
                    `CO₂ Emissions: ${totalCO2.toFixed(2)} kg`;
                } else {
                  document.getElementById("co2Text").textContent =
                    `CO₂ Emissions: Select a vehicle first`;
                }

                document.getElementById("distanceText").textContent =
                  `Distance: ${distanceMiles.toFixed(2)} miles`;
                document.getElementById("durationText").textContent =
                  `Time: ${distanceData.duration}`;
              }
            }
          } catch (err) {
            console.error(err);
            alert("Error searching location");
          }
        });

      document.getElementById("Make").addEventListener("change", function () {
        const selectedMake = this.value;

        const models = [
          ...new Set(
            carData
              .filter((car) => car.Make === selectedMake)
              .map((car) => car.Model),
          ),
        ];

        const modelSelect = document.getElementById("Model");
        modelSelect.innerHTML = "<option>Select Model</option>";

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model;
          option.textContent = model;
          modelSelect.appendChild(option);
        });
      });

      document.getElementById("Model").addEventListener("change", function () {
        const selectedMake = document.getElementById("Make").value;
        const selectedModel = this.value;

        const engineSizes = [
          ...new Set(
            carData
              .filter(
                (car) =>
                  car.Make === selectedMake && car.Model === selectedModel,
              )
              .map((car) => car.EngineSize),
          ),
        ];

        const engineSizeSelect = document.getElementById("EngineSize");
        engineSizeSelect.innerHTML = "<option>Select Engine Size</option>";

        const fuelTypeSelect = document.getElementById("FuelType");
        fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
        fuelTypeSelect.disabled = true;

        engineSizes.forEach((size) => {
          const option = document.createElement("option");
          option.value = size;
          option.textContent = size;
          engineSizeSelect.appendChild(option);
        });
      });

      document
        .getElementById("EngineSize")
        .addEventListener("change", function () {
          const selectedMake = document.getElementById("Make").value;
          const selectedModel = document.getElementById("Model").value;
          const selectedEngineSize = Number(this.value);

          const fuelTypes = [
            ...new Set(
              carData
                .filter(
                  (car) =>
                    car.Make === selectedMake &&
                    car.Model === selectedModel &&
                    Number(car.EngineSize) === selectedEngineSize,
                )
                .map((car) => car.FuelType),
            ),
          ];

          const fuelTypeSelect = document.getElementById("FuelType");
          fuelTypeSelect.innerHTML = "";

          if (fuelTypes.length === 0) {
            fuelTypeSelect.innerHTML = "<option>No Fuel Type Found</option>";
            fuelTypeSelect.disabled = true;
            return;
          }

          if (fuelTypes.length === 1) {
            const onlyFuel = fuelTypes[0];
            const upperFuel = onlyFuel.toUpperCase();
            fuelTypeSelect.innerHTML = `<option value="${onlyFuel}">${fuelTypeMap[upperFuel] || onlyFuel}</option>`;
            fuelTypeSelect.disabled = true;
            return;
          }

          fuelTypeSelect.innerHTML = "<option>Select Fuel Type</option>";
          fuelTypeSelect.disabled = false;

          fuelTypes.forEach((type) => {
            const upperType = type.toUpperCase();
            const option = document.createElement("option");
            option.value = type;
            option.textContent = fuelTypeMap[upperType] || type;
            fuelTypeSelect.appendChild(option);
          });
        });

      // 🚀 Start everything
      window.onload = () => {
        initMap();
        loadCars();
      };
    </script>
  </body>
</html>
